name: Tests

on:
  push:
    branches: [main, ontofuel-v0.1, "feature/**"]
  pull_request:
    branches: [main, ontofuel-v0.1]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install fastapi uvicorn psycopg2-binary sphinx
        pip install chonkie model2vec sentence-transformers
    - name: Run tests
      env:
        ONTOFUEL_CI: "true"
      run: pytest tests/ --ignore=tests/test_docker_integration.py -v --tb=short --cov=ontofuel --cov-report=xml --cov-fail-under=86
    - name: Upload coverage
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
