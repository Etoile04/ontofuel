name: Lint

on:
  push:
    branches: [main, ontofuel-v0.1, "feature/**"]
  pull_request:
    branches: [main, ontofuel-v0.1]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        uses: astral-sh/setup-ruff@v3
      - name: Lint check
        run: ruff check src/ tests/
      - name: Format check
        run: ruff format --check src/ tests/
